<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LALA ENGLISH 원장 관리 시스템</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Montserrat:wght@600;700;800;900&family=Cormorant+Garamond:wght@600;700&display=swap');

:root {
  --navy: #1f2c5c;
  --gold: #f2c640;
  --slate: #2e3d52;
  --bg: #f5f6fa;
  --white: #ffffff;
  --border: #e2e5ef;
  --text: #1a2040;
  --muted: #7880a0;
  --green: #1e7e4e;
  --red: #b83232;
  --yellow: #b87a0a;
  --radius: 10px;
  --shadow: 0 2px 12px rgba(31,44,92,0.07);
  --shadow-hover: 0 8px 28px rgba(31,44,92,0.14);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

/* ── HEADER ── */
.site-header {
  background: var(--navy);
  height: 66px; padding: 0 48px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 2px 24px rgba(31,44,92,0.28);
}

.logo-wrap { display: flex; align-items: center; gap: 11px; }

.logo-mark { width: 32px; height: 32px; flex-shrink: 0; }

.logo-left {
  font-family: 'Montserrat', sans-serif;
  font-weight: 800; font-size: 16px;
  color: #fff; letter-spacing: 2px;
}

.logo-divider {
  width: 1px; height: 22px;
  background: rgba(255,255,255,0.18);
  margin: 0 10px;
}

.logo-right {
  display: flex; flex-direction: column; gap: 1px;
}

.logo-right-main {
  font-family: 'Cormorant Garamond', serif;
  font-size: 15px; font-weight: 700;
  color: rgba(255,255,255,0.75); letter-spacing: 3px;
}

.logo-right-sub {
  font-family: 'Montserrat', sans-serif;
  font-size: 8px; font-weight: 600;
  color: rgba(255,255,255,0.35); letter-spacing: 0.2em;
  text-transform: uppercase;
}

.header-nav { display: flex; align-items: center; gap: 4px; }

.nav-btn {
  padding: 7px 16px; border-radius: 8px; border: none;
  background: transparent; color: rgba(255,255,255,0.6);
  font-family: 'Noto Sans KR', sans-serif; font-size: 13px;
  font-weight: 500; cursor: pointer; transition: all 0.18s;
}
.nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.nav-btn.active { background: rgba(255,255,255,0.15); color: #fff; font-weight: 700; }

.header-date { font-size: 11px; color: rgba(255,255,255,0.35); }

/* ── HERO ── */
.hero {
  background: var(--navy);
  padding: 40px 48px 44px;
  position: relative; overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute; top: -50px; right: -50px;
  width: 260px; height: 260px; border-radius: 50%;
  border: 38px solid rgba(242,198,64,0.07);
  pointer-events: none;
}

/* KHN 워터마크 */
.hero-wm {
  position: absolute; right: 52px; top: 50%;
  transform: translateY(-50%);
  font-family: 'Cormorant Garamond', serif;
  font-size: 80px; font-weight: 700;
  color: rgba(255,255,255,0.03);
  letter-spacing: 6px; pointer-events: none; user-select: none;
}

.hero-eyebrow {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 10px;
}

.hero-title {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900; font-size: 26px;
  color: #fff; letter-spacing: 0.3px;
  margin-bottom: 4px;
}
.hero-title .gold { color: var(--gold); }

.hero-title-khn {
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,0.3);
  letter-spacing: 3px; margin-bottom: 10px;
}

.hero-sub { font-size: 12.5px; color: rgba(255,255,255,0.42); font-weight: 300; }

/* ── CONTENT ── */
.content { padding: 32px 48px 52px; max-width: 1080px; }

.page { display: none; }
.page.active { display: block; }

/* ── HOME CARDS ── */
.home-category-row { margin-bottom: 22px; }

.home-cat-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 9.5px; font-weight: 800;
  color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.14em; margin-bottom: 9px;
  display: flex; align-items: center; gap: 10px;
}
.home-cat-label::after {
  content: ''; flex: 1; height: 1px;
  background: var(--border); max-width: 140px;
}

.home-cat-cards { display: flex; flex-wrap: wrap; gap: 9px; }

.home-link-card {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  display: flex; align-items: center;
  justify-content: space-between; gap: 18px;
  box-shadow: var(--shadow);
  text-decoration: none; color: var(--text);
  transition: all 0.2s;
  width: 248px; flex: none;
  position: relative; overflow: hidden; cursor: pointer;
}

.home-link-card::after {
  content: '';
  position: absolute; bottom: 0; left: 0;
  width: 100%; height: 2.5px;
  background: linear-gradient(90deg, var(--navy), var(--gold));
  opacity: 0; transition: opacity 0.2s;
}

.home-link-card:hover { border-color: var(--navy); transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.home-link-card:hover::after { opacity: 1; }

.hlc-title { font-size: 13px; font-weight: 700; }
.hlc-arrow { font-size: 12px; color: var(--muted); flex-shrink: 0; transition: color 0.2s; }
.home-link-card:hover .hlc-arrow { color: var(--navy); }

/* 선생님 버튼 */
.teacher-btn-eng { border-color: #c5d4e8 !important; background: #eef4fa !important; }
.teacher-btn-eng .hlc-title { color: var(--navy); }
.teacher-btn-eng::after { background: var(--navy) !important; }

.teacher-btn-math { border-color: #c5cdd8 !important; background: #eef0f4 !important; }
.teacher-btn-math .hlc-title { color: var(--slate); }
.teacher-btn-math::after { background: var(--slate) !important; }

/* ── SALARY PAGE ── */
.drop-zone {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 44px 20px; text-align: center; cursor: pointer;
  transition: all 0.2s; background: var(--white);
  max-width: 560px; margin: 0 auto 28px;
  box-shadow: var(--shadow);
}
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--navy); background: #eef4fa; }
.drop-zone p { color: var(--muted); font-size: 13px; line-height: 1.7; }
.drop-zone strong { color: var(--navy); }
#fileInput { display: none; }

.file-name { display: none; text-align: center; color: var(--green); font-size: 13px; margin-bottom: 20px; }
.wage-section { display: none; max-width: 900px; margin: 0 auto 24px; }

.section-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 10px; font-weight: 800;
  color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.14em; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}

.wage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(225px,1fr)); gap: 10px; }

.wage-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; box-shadow: var(--shadow);
}
.wage-card .teacher-name { font-size: 13px; font-weight: 600; flex: 1; }

.wage-input-wrap {
  display: flex; align-items: center; gap: 4px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 10px;
}
.wage-input-wrap input {
  width: 76px; background: none; border: none; outline: none;
  color: var(--yellow); font-family: inherit;
  font-size: 14px; text-align: right; font-weight: 700;
}
.wage-input-wrap span { font-size: 11px; color: var(--muted); }

.calc-btn-wrap { max-width: 900px; margin: 0 auto 28px; display: none; }
.calc-btn {
  width: 100%; padding: 13px; background: var(--navy);
  border: none; border-radius: var(--radius); color: white;
  font-family: 'Noto Sans KR', sans-serif; font-size: 14px;
  font-weight: 700; cursor: pointer; transition: opacity 0.2s;
}
.calc-btn:hover { opacity: 0.88; }

.sal-results { display: none; max-width: 900px; margin: 0 auto; }

.summary-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px,1fr)); gap: 12px; margin-bottom: 24px; }

.stat-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
}
.stat-card .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; font-family: 'Montserrat', sans-serif; font-weight: 700; }
.stat-card .value { font-size: 20px; font-weight: 700; color: var(--text); }
.stat-card .value.green { color: var(--green); }
.stat-card .value.yellow { color: var(--yellow); }
.stat-card .value.blue { color: var(--navy); }

.table-wrap { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: var(--bg); padding: 10px 14px; text-align: left; color: var(--muted); font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); font-family: 'Montserrat', sans-serif; }
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.12s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f4f6fb; }
tbody td { padding: 11px 14px; vertical-align: middle; }

.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-blue { background: rgba(31,44,92,0.08); color: var(--navy); }

.teacher-section { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow); }
.teacher-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; cursor: pointer; user-select: none; background: var(--bg); gap: 10px; transition: background 0.15s; }
.teacher-header:hover { background: #eaecf5; }
.teacher-header .tname { font-weight: 700; font-size: 13.5px; }
.teacher-header .tsummary { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.teacher-header .tsummary strong { color: var(--text); }
.chevron { transition: transform 0.2s; font-size: 10px; color: var(--muted); }
.teacher-section.open .chevron { transform: rotate(180deg); }
.teacher-body { display: none; padding: 0 18px 16px; }
.teacher-section.open .teacher-body { display: block; }

.daily-table { width: 100%; margin-top: 12px; }
.daily-table th { font-size: 10px; color: var(--muted); font-weight: 700; text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.05em; font-family: 'Montserrat', sans-serif; }
.daily-table td { padding: 7px 8px; font-size: 12px; border-bottom: 1px solid var(--border); }
.daily-table tr:last-child td { border-bottom: none; }
.tax-note { font-size: 11px; color: var(--muted); text-align: right; margin-top: 6px; }
.error-msg { background: rgba(184,50,50,0.07); border: 1px solid rgba(184,50,50,0.2); color: var(--red); padding: 12px 16px; border-radius: var(--radius); font-size: 13px; max-width: 560px; margin: 0 auto 20px; display: none; }

.reset-btn { margin-left: auto; font-size: 11px; padding: 4px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-family: 'Noto Sans KR', sans-serif; cursor: pointer; }
.reset-btn:hover { border-color: var(--navy); color: var(--navy); }

/* ── LINKS PAGE ── */
.link-category-section { margin-bottom: 28px; }
.link-cat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.link-cat-title { font-family: 'Montserrat', sans-serif; font-size: 9.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.12em; }
.link-cat-empty { font-size: 12px; color: var(--muted); padding: 12px 0; }

.link-row { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow); gap: 16px; margin-bottom: 8px; }
.link-row-info { flex: 1; min-width: 0; }
.link-row-label { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; }
.link-row-url { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.link-row-actions { display: flex; gap: 8px; flex-shrink: 0; }

.btn-open { padding: 7px 14px; background: var(--navy); color: white; border: none; border-radius: 8px; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; font-weight: 600; cursor: pointer; text-decoration: none; transition: opacity 0.18s; display: inline-flex; align-items: center; }
.btn-open:hover { opacity: 0.85; }
.btn-edit { padding: 7px 12px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: all 0.18s; }
.btn-edit:hover { border-color: var(--navy); color: var(--navy); }

/* ── MODAL ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--white); border-radius: var(--radius); padding: 28px; width: 480px; max-width: 92vw; box-shadow: 0 12px 40px rgba(0,0,0,0.18); }
.modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 20px; }
.modal-field { margin-bottom: 16px; }
.modal-field label { display: block; font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; font-family: 'Montserrat', sans-serif; }
.modal-field input { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s; }
.modal-field input:focus { border-color: var(--navy); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.btn-save { padding: 8px 22px; background: var(--navy); color: white; border: none; border-radius: 8px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; font-weight: 700; cursor: pointer; transition: opacity 0.18s; }
.btn-save:hover { opacity: 0.85; }
.btn-cancel { padding: 8px 18px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="logo-wrap">
    <svg class="logo-mark" viewBox="0 0 68 68" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="34" cy="34" r="31" stroke="white" stroke-width="2.8"/>
      <line x1="34" y1="10" x2="34" y2="54" stroke="white" stroke-width="2.5"/>
      <line x1="34" y1="10" x2="19" y2="54" stroke="white" stroke-width="2.5"/>
      <line x1="34" y1="10" x2="49" y2="54" stroke="white" stroke-width="2.5"/>
      <line x1="16" y1="54" x2="52" y2="54" stroke="white" stroke-width="2.5"/>
      <line x1="25" y1="38" x2="43" y2="38" stroke="white" stroke-width="2.2"/>
      <polygon points="34,10 46,16 34,22" fill="#f2c640"/>
    </svg>
    <span class="logo-left">LALA ENGLISH</span>
    <div class="logo-divider"></div>
    <div class="logo-right">
      <span class="logo-right-main">KHN</span>
      <span class="logo-right-sub">Strong Na Math</span>
    </div>
  </div>

  <nav class="header-nav">
    <button class="nav-btn active" onclick="showPage('home', this)">홈</button>
    <button class="nav-btn" onclick="showPage('salary', this)">월급 계산기</button>
    <button class="nav-btn" onclick="showPage('links', this)">자료 링크</button>
  </nav>

  <div class="header-date" id="headerDate"></div>
</header>

<!-- HERO -->
<div class="hero">
  <div class="hero-wm">KHN</div>
  <div class="hero-eyebrow">Principal Dashboard · 원장 전용</div>
  <div class="hero-title">LALA <span class="gold">ENGLISH</span> 원장 관리 시스템</div>
  <div class="hero-title-khn">KHN · STRONG NA MATH</div>
  <div class="hero-sub">학원 운영에 필요한 모든 자료를 한곳에서 관리합니다</div>
</div>

<!-- CONTENT -->
<div class="content">

  <div class="page active" id="page-home"></div>

  <div class="page" id="page-links">
    <div class="links-list" id="linksList"></div>
  </div>

  <div class="page" id="page-salary">
    <div class="drop-zone" id="dropZone">
      <p><strong>엑셀 파일을 여기에 끌어다 놓거나 클릭하세요</strong><br>출퇴근 기록 .xlsx 파일을 지원합니다</p>
      <input type="file" id="fileInput" accept=".xlsx,.xls">
    </div>
    <div class="file-name" id="fileName"></div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="wage-section" id="wageSection">
      <div class="section-title">
        선생님별 시급 설정
        <button class="reset-btn" onclick="resetWages()">기본값으로 초기화</button>
      </div>
      <div class="wage-grid" id="wageGrid"></div>
    </div>
    <div class="calc-btn-wrap" id="calcBtnWrap">
      <button class="calc-btn" onclick="calculate()">급여 계산하기</button>
    </div>
    <div class="sal-results" id="salResults"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">링크 수정</h3>
    <div class="modal-field">
      <label>제목</label>
      <input type="text" id="modalLabel" placeholder="예) 영어 교재비 확인 5월(작성중)">
    </div>
    <div class="modal-field">
      <label>URL</label>
      <input type="text" id="modalUrl" placeholder="https://...">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveModal()">저장</button>
    </div>
  </div>
</div>

// MODAL
function openEditModal(catId,linkId){
  const cat=categories.find(c=>c.id===catId), lk=cat?.links.find(l=>l.id===linkId);
  if(!lk) return;
  editingId={catId,linkId}; addingToCatId=null;
  document.getElementById('modalTitle').textContent='링크 수정';
  document.getElementById('modalLabel').value=lk.label;
  document.getElementById('modalUrl').value=lk.url;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalLabel').focus();
}
function openAddModal(catId){
  editingId=null; addingToCatId=catId||null;
  document.getElementById('modalTitle').textContent=catId?`링크 추가 — ${categories.find(c=>c.id===catId)?.label}`:'링크 추가';
  document.getElementById('modalLabel').value=''; document.getElementById('modalUrl').value='';
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalLabel').focus();
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); editingId=null; addingToCatId=null; }
function saveModal(){
  const label=document.getElementById('modalLabel').value.trim(), url=document.getElementById('modalUrl').value.trim();
  if(!label){document.getElementById('modalLabel').focus();return;}
  if(!url){document.getElementById('modalUrl').focus();return;}
  if(editingId){const cat=categories.find(c=>c.id===editingId.catId),lk=cat?.links.find(l=>l.id===editingId.linkId);if(lk){lk.label=label;lk.url=url;}}
  else if(addingToCatId){const cat=categories.find(c=>c.id===addingToCatId);if(cat)cat.links.push({id:Date.now(),label,url});}
  closeModal(); renderLinksList(); renderHomeCards();
}
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('modalLabel').addEventListener('keydown',e=>{if(e.key==='Enter')saveModal();});
document.getElementById('modalUrl').addEventListener('keydown',e=>{if(e.key==='Enter')saveModal();});
renderHomeCards();

// SALARY
let parsedData=null;
const WAGE_DEFAULTS={'홍준기':13000,'홍윤서':13000,'최윤아':13000,'윤혜린':12000,'정다은':12000,'변소연':12000};
const EXCLUDE_TEACHERS=['서슬기'];

const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');const f=e.dataTransfer.files[0];if(f)handleFile(f);});
dz.addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change',e=>{if(e.target.files[0])handleFile(e.target.files[0]);});

function showError(msg){const el=document.getElementById('errorMsg');el.textContent=msg;el.style.display='block';}
function hideError(){document.getElementById('errorMsg').style.display='none';}

function handleFile(file){
  hideError();
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellText:true,cellNF:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      parsedData=parseAttendance(raw);
      if(parsedData.length===0){showError('출퇴근 데이터를 찾을 수 없습니다.');return;}
      document.getElementById('fileName').textContent=`✓ ${file.name} — 선생님 ${parsedData.length}명 감지됨`;
      document.getElementById('fileName').style.display='block';
      buildWageInputs();
      document.getElementById('wageSection').style.display='block';
      document.getElementById('calcBtnWrap').style.display='block';
      document.getElementById('salResults').style.display='none';
    }catch(err){showError('파일 오류: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

function parseTime(str){
  str=str.trim();const m=str.match(/(오전|오후)\s+(\d+):(\d+)/);if(!m)return null;
  let h=parseInt(m[2]);const min=parseInt(m[3]);
  if(m[1]==='오전'){if(h===12)h=0;}else{if(h!==12)h+=12;}
  return h*60+min;
}
function minutesToHHMM(mins){return `${Math.floor(mins/60)}시간 ${String(mins%60).padStart(2,'0')}분`;}
function parseAttendance(rows){
  const teachers=[];
  for(let r=2;r<rows.length;r++){
    const cell0=String(rows[r][0]||'');if(!cell0.includes('선생님출퇴근'))continue;
    const lines=cell0.split(/\n/).map(s=>s.trim()).filter(Boolean);
    const name=lines[1]?lines[1].replace(/선생님$/,'').trim():`선생님${r}`;
    const days=[];
    for(let c=1;c<=31;c++){
      const cell=String(rows[r][c]||'');if(!cell.includes('출석'))continue;
      const times=[];const re=/(오전|오후)\s+(\d+:\d+)/g;let match;
      while((match=re.exec(cell))!==null)times.push(match[0].replace(/\s+/g,' ').trim());
      if(times.length>=2){const inMin=parseTime(times[0]),outMin=parseTime(times[1]);
        if(inMin!==null&&outMin!==null)days.push({day:c,inTime:times[0],outTime:times[1],workedMin:outMin>inMin?outMin-inMin:outMin+1440-inMin});}
    }
    if(!EXCLUDE_TEACHERS.includes(name))teachers.push({name,days});
  }
  return teachers;
}
function buildWageInputs(){
  const grid=document.getElementById('wageGrid');grid.innerHTML='';
  parsedData.forEach(t=>{
    const dw=WAGE_DEFAULTS[t.name]??12000;
    const div=document.createElement('div');div.className='wage-card';
    div.innerHTML=`<span class="teacher-name">${t.name} 선생님</span><div class="wage-input-wrap"><input type="number" id="wage_${t.name}" value="${dw}" min="0" step="500"><span>원/시간</span></div>`;
    grid.appendChild(div);
  });
}
function resetWages(){if(!parsedData)return;parsedData.forEach(t=>{const el=document.getElementById(`wage_${t.name}`);if(el)el.value=WAGE_DEFAULTS[t.name]??12000;});}
function fmtWon(n){return Math.round(n).toLocaleString('ko-KR')+'원';}
function calculate(){
  const TAX=0.033;
  const results=parsedData.map(t=>{
    const hourlyWage=parseFloat(document.getElementById(`wage_${t.name}`)?.value)||0;
    const totalMin=t.days.reduce((s,d)=>s+d.workedMin,0);
    const grossPay=(totalMin/60)*hourlyWage;const taxAmt=grossPay*TAX;
    return{...t,hourlyWage,totalMin,totalHours:totalMin/60,grossPay,taxAmt,netPay:grossPay-taxAmt};
  });
  const totalGross=results.reduce((s,r)=>s+r.grossPay,0);
  const totalNet=results.reduce((s,r)=>s+r.netPay,0);
  const totalDays=results.reduce((s,r)=>s+r.days.length,0);
  let html=`
    <div class="section-title">급여 요약</div>
    <div class="summary-row">
      <div class="stat-card"><div class="label">선생님 수</div><div class="value blue">${results.length}명</div></div>
      <div class="stat-card"><div class="label">총 출근일수</div><div class="value">${totalDays}일</div></div>
      <div class="stat-card"><div class="label">총 급여 (세전)</div><div class="value yellow">${fmtWon(totalGross)}</div></div>
      <div class="stat-card"><div class="label">총 실지급액</div><div class="value green">${fmtWon(totalNet)}</div></div>
    </div>
    <div class="section-title">선생님별 급여 상세</div>
    <div class="table-wrap"><table>
      <thead><tr><th>이름</th><th>출근일수</th><th>총 근무시간</th><th>시급</th><th>세전 급여</th><th>공제 (3.3%)</th><th>실 지급액</th></tr></thead>
      <tbody>${results.map(r=>`<tr>
        <td><strong>${r.name}</strong> 선생님</td>
        <td><span class="badge badge-blue">${r.days.length}일</span></td>
        <td>${minutesToHHMM(r.totalMin)}<br><span style="color:var(--muted);font-size:11px;">${r.totalHours.toFixed(2)}시간</span></td>
        <td style="color:var(--yellow);font-weight:700">${r.hourlyWage.toLocaleString()}원</td>
        <td style="font-weight:600">${fmtWon(r.grossPay)}</td>
        <td style="color:var(--red)">−${fmtWon(r.taxAmt)}</td>
        <td style="color:var(--green);font-weight:700">${fmtWon(r.netPay)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <p class="tax-note">※ 3.3% = 소득세 3% + 지방소득세 0.3%</p>
    <div class="section-title" style="margin-top:24px">일별 근무 기록</div>`;
  results.forEach(r=>{
    html+=`<div class="teacher-section" onclick="toggleSection(this)">
      <div class="teacher-header">
        <span class="tname">${r.name} 선생님</span>
        <div class="tsummary">
          <span>출근 <strong>${r.days.length}일</strong></span>
          <span>총 <strong>${minutesToHHMM(r.totalMin)}</strong></span>
          <span>실지급 <strong style="color:var(--green)">${fmtWon(r.netPay)}</strong></span>
        </div>
        <span class="chevron">▼</span>
      </div>
      <div class="teacher-body">
        <table class="daily-table">
          <thead><tr><th>날짜</th><th>출근</th><th>퇴근</th><th>근무시간</th></tr></thead>
          <tbody>
            ${r.days.map(d=>`<tr><td>${d.day}일</td><td style="color:var(--navy)">${d.inTime}</td><td style="color:var(--red)">${d.outTime}</td><td>${minutesToHHMM(d.workedMin)}</td></tr>`).join('')}
            <tr style="font-weight:700;background:var(--bg)"><td colspan="3" style="color:var(--muted)">합계</td><td>${minutesToHHMM(r.totalMin)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>`;
  });
  const el=document.getElementById('salResults');
  el.innerHTML=html; el.style.display='block';
  el.scrollIntoView({behavior:'smooth',block:'start'});
}
function toggleSection(el){el.classList.toggle('open');}
</script>
